name: Release APK

on:
  # Run it by hand: GitHub > Actions > Release APK > Run workflow
  workflow_dispatch:
  # Or push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to attach the APK to a GitHub Release

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The app compiles against API 36.1 (compileSdk = release(36) { minorApiLevel = 1 }),
      # which the runner's SDK does not ship with. Install it up front so Gradle doesn't
      # fail trying to auto-download it.
      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1"

      # The project does not include a Gradle wrapper, so install the version it expects.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/rorax-upload-key.jks"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD_SECRET:-}" ] && [ -n "${KEY_PASSWORD_SECRET:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASSWORD="$STORE_PASSWORD_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
            echo "Using the signing key from repository secrets."
          else
            # No key configured: sign with a throwaway key so the build still completes.
            # An APK signed this way cannot be installed over an APK signed with your real key.
            STORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$STORE_PASSWORD"
            keytool -genkeypair -v -keystore "$KEYSTORE_FILE" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=RORaX Music, O=RORaX" > /dev/null
            echo "::warning::No signing secrets found. Built with a temporary key; add KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD secrets for a real release."
          fi
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          [ -n "$SRC" ] || { echo "No APK was produced"; exit 1; }
          VERSION="${GITHUB_REF_NAME//\//-}"
          OUT="RORaX-Music-${VERSION}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RORaX-Music-release-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
